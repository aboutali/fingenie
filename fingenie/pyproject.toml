[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fingenie"
version = "0.1.0"
description = "Lightweight engine that bundles many free financial-data sources behind one clean, normalized interface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fingenie" }]
keywords = ["finance", "stocks", "crypto", "fx", "market-data", "api"]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "diskcache>=5.6",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
    "yfinance>=0.2.40",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
metrics = ["pandas>=2.0", "numpy>=1.26"]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
fingenie = "fingenie.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fingenie"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
